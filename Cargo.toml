[package]
name         = "sema"
version      = "0.1.1"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/sema"
description  = "Typed, version-guarded database kernel over redb and rkyv"

[dependencies]
redb = { git = "https://github.com/LiGoldragon/redb", rev = "8b630aaa3f428ab1c3cd2994d9311376b17e3c53" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror = "2"
