[package]
name         = "memory"
version      = "0.1.1"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/memory"
description  = "Typed, version-guarded database kernel over redb and rkyv"

[dependencies]
redb = "4"
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror = "2"
